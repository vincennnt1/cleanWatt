[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleanwatt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gridstatus>=0.24.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "openmeteo-requests>=1.2",
    "duckdb>=1.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "streamlit>=1.35",
    "altair>=5.0",
    "requests-cache>=1.3.2",
    "retry-requests>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "playwright>=1.60.0",
]
