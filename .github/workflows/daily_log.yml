name: Daily forecast log

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC = 03:00 ET — after IESO publishes overnight data
  workflow_dispatch:       # manual trigger for testing

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Append forecast log
        run: uv run python -m cleanwatt.log_forecast

      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecast_log.parquet
          git diff --staged --quiet || git commit -m "chore: forecast log $(date -u +%Y-%m-%d)"
          git push
